# ---------------------------------------------------------------------------
# Context-free grammar for the Semantically-Guided Error-Correcting Earley
# Parser.
#
# Syntax:  LHS -> RHS1 RHS2 ... | ALT1 ALT2 ...
#   * Non-terminals are upper-case and appear on some left-hand side.
#   * Any symbol that never appears on a left-hand side is a PRE-TERMINAL (a
#     POS tag); its words come from data/lexicon.tsv, not from this file.
#   * '#' starts a comment; blank lines are ignored; EPS denotes epsilon.
#
# Two design decisions drive the whole grammar.
#
# 1. NUMBER AGREEMENT IS ENCODED STRUCTURALLY.  A singular subject takes a
#    singular verb phrase (NPS + VPS), a plural subject a plural one
#    (NPP + VPP).  Subject-verb agreement is therefore a genuine syntactic
#    constraint that the error-correcting parser must repair, rather than
#    something checked afterwards.
#
# 2. VERBS CARRY THEIR SUBCATEGORISATION CLASS IN THEIR TAG.  VT* is
#    transitive, VI* intransitive, VD* ditransitive, VS* takes a sentential
#    complement, VC* is copular.  Without this the grammar over-generates
#    wildly -- "the man slept big", "a patient on she ate very" -- and an
#    over-generating grammar is actively harmful here, because the parser
#    repairs an input only as far as the nearest string the grammar accepts.
#    The looser the grammar, the worse the corrections.
# ---------------------------------------------------------------------------

# -- Sentence level ---------------------------------------------------------
S -> NPS VPS | NPP VPP | VPIMP | ADVP S

# -- Noun phrases -----------------------------------------------------------
# Singular count nouns require a determiner, so a missing determiner is a real
# syntactic error.  Bare plurals ("dogs bark") are legal.
NPS -> DTS NOMS | PRPS | NNPS
NPP -> DTP NOMP | NOMP | PRPP

NOMS -> NNS | ADJP NOMS | NNS PP
NOMP -> NNP | ADJP NOMP | NNP PP

# Object position has no agreement and admits accusative pronouns.
NPO -> NPS | NPP | PRPO

ADJP -> JJ | DEG JJ | JJ ADJP

# -- Verb phrases -----------------------------------------------------------
# Present tense splits by number; past tense does not, so the past forms (VxD)
# appear in both VPS and VPP.

# Singular present + past
VPS -> VIZ | VID
VPS -> VTZ NPO | VTD NPO
VPS -> VDZ NPO NPO | VDD NPO NPO
VPS -> VCZ ADJP | VCD ADJP | VCZ NPO | VCD NPO
VPS -> VSZ SBAR | VSD SBAR
VPS -> MD VIB | MD VTB NPO | MD VDB NPO NPO | MD VCB ADJP | MD VSB SBAR

# Plural present + past
VPP -> VIP | VID
VPP -> VTP NPO | VTD NPO
VPP -> VDP NPO NPO | VDD NPO NPO
VPP -> VCP ADJP | VCD ADJP | VCP NPO | VCD NPO
VPP -> VSP SBAR | VSD SBAR
VPP -> MD VIB | MD VTB NPO | MD VDB NPO NPO | MD VCB ADJP | MD VSB SBAR

# Imperative: bare verb, no subject.
VPIMP -> VIB | VTB NPO | VDB NPO NPO

# Adjuncts.  Adjoining PPs and adverbs to a complete VP, rather than listing a
# frame for every combination, keeps the rule count down and leaves adjunct
# order free.  The left recursion is deliberate: Earley handles left-recursive
# rules natively, which a naive top-down parser does not.
VPS   -> VPS PP | VPS ADVP | ADVP VPS
VPP   -> VPP PP | VPP ADVP | ADVP VPP
VPIMP -> VPIMP PP | VPIMP ADVP

# -- Modifiers --------------------------------------------------------------
PP   -> IN NPO
ADVP -> RB

# -- Embedded clause --------------------------------------------------------
# Recursive: an embedded S may itself contain an embedded S.
SBAR -> CMP S
