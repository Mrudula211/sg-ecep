[project]
name = "sg-ecep"
version = "1.0.0"
description = "Semantically-Guided Error-Correcting Earley Parser"
requires-python = ">=3.10"
dependencies = ["nltk>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["sgecep"]
